name: Release merged changes

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

concurrency:
  group: changelog-release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.CHANGELOG_APP_CLIENT_ID }}
          private-key: ${{ secrets.CHANGELOG_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.4.0
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/changelog-release.ts
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: Open or update the changelog pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CHANGELOG_BRANCH: automation/changelog
        run: |
          if git diff --quiet -- README.md CHANGELOG.md; then
            exit 0
          fi
          git switch -C "$CHANGELOG_BRANCH"
          git config user.name 'Chariot changelog bot[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CHANGELOG.md
          git commit -m 'chore(release): sync changelog'
          git push --force-with-lease origin "HEAD:$CHANGELOG_BRANCH"
          PR_NUMBER="$(gh pr list --head "$CHANGELOG_BRANCH" --base main --state open --json number --jq '.[0].number')"
          if [ -z "$PR_NUMBER" ]; then
            PR_URL="$(gh pr create --base main --head "$CHANGELOG_BRANCH" --title 'chore(release): sync changelog' --body 'Automated changelog and README synchronization.')"
            PR_NUMBER="${PR_URL##*/}"
          fi
          gh pr edit "$PR_NUMBER" --add-label release-automation
          gh pr merge "$PR_NUMBER" --auto --squash
      - name: Open an automation failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          ISSUE_NUMBER="$(gh issue list --state open --search 'changelog automation failure in:title' --json number --jq '.[0].number')"
          if [ -z "$ISSUE_NUMBER" ]; then
            gh issue create --title 'changelog automation failure' --body "The release workflow failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
